services:
  - type: web
    name: society-backend
    env: java
    rootDir: backend
    plan: free
    buildCommand: chmod +x mvnw ; ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: society-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: society-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: society-db
          property: password
      - key: APP_FRONTEND_URL
        fromService:
          name: society-admin-web
          type: web
          property: url
      - key: JWT_COOKIE_SECURE
        value: "true"

  - type: web
    name: society-admin-web
    env: static
    rootDir: admin-web
    plan: free
    buildCommand: npm ci ; npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: society-backend
          type: web
          property: url

databases:
  - name: society-db
    databaseName: society_db
    user: society_user