spring.application.name=backend

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/society_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.tool.hbm2ddl=WARN
logging.level.org.hibernate.type.descriptor.sql=${SQL_TRACE_LEVEL:WARN}
# Suppress Spring Security AuthenticationProvider/UserDetailsService config warning
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsManagerConfigurer=ERROR

# ===============================
# Server
# ===============================
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================
# Actuator (Health Check for Render)
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdSYW5kb21TZWN1cmVLZXk=}
jwt.expiration-ms=86400000
jwt.remember-me-expiration-ms=2592000000
jwt.cookie.max-age=86400
jwt.cookie.remember-me-max-age=2592000
# Set to true in production with HTTPS, false for localhost development
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}

# ===============================
# Email Configuration (Gmail SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# App Configuration
# ===============================
app.name=Society Management System
app.admin.email=${APP_ADMIN_EMAIL}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.reminder.contract-days=30
app.reminder.tenant-days=30
app.reminder.bill-days=7
auth.society-admin.proximity-threshold-meters=${AUTH_SOCIETY_ADMIN_PROXIMITY_THRESHOLD_METERS:300}
security.master-admin.special-key=${MASTER_ADMIN_SPECIAL_KEY:TANMAY}
security.document-metadata.encryption-secret=${DOC_METADATA_ENCRYPTION_SECRET:change-me-rotate-in-prod}
app.storage.complaint-attachments-dir=${COMPLAINT_ATTACHMENTS_DIR:uploads/complaints}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:25MB}
member.office-hours.start=${MEMBER_OFFICE_HOURS_START:09:30}
member.office-hours.end=${MEMBER_OFFICE_HOURS_END:18:30}
member.office-hours.zone=${MEMBER_OFFICE_HOURS_ZONE:Asia/Kolkata}
member.office-hours.days=${MEMBER_OFFICE_HOURS_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY}
# Direct complaint categories that follow office-hours gating for MEMBER role.
# SECURITY is intentionally excluded so members can report security issues 24x7.
member.direct-communication.complaint-categories=${MEMBER_DIRECT_COMMUNICATION_COMPLAINT_CATEGORIES:NOISE,PARKING,MAINTENANCE,CLEANLINESS,NEIGHBOR_ISSUE,OTHER}

# ===============================
# Razorpay Configuration
# ===============================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=INR
