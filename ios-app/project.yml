name: SocietyManager
options:
  bundleIdPrefix: com.societymanager
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  SocietyManager:
    type: application
    platform: iOS
    sources:
      - path: SocietyManager
        excludes:
          - Tests/**
    info:
      path: SocietyManager/Info.plist
      properties:
        CFBundleDisplayName: Society Manager
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.societymanager.app
        INFOPLIST_FILE: SocietyManager/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Society Manager
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: true

  SocietyManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SocietyManager/Tests
    dependencies:
      - target: SocietyManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.societymanager.app.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SocietyManager.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SocietyManager"
        BUNDLE_LOADER: "$(TEST_HOST)"
